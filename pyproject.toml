[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vmrecover"
version = "0.1.0"
description = "Static recovery of algorithms hidden inside custom VM bytecode — no emulator required"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vmrecover = "vmrecover.cli:main"

[tool.setuptools.packages.find]
include = ["vmrecover*"]
